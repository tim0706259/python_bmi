<!DOCTYPE html>
<html>
<head>
    <title>BMI 計算器</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f7f9fa; }
        .container { max-width: 300px; margin: 0 auto; padding: 30px; border: 1px solid #e1e4e6; border-radius: 12px; background-color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 97%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 25px; font-weight: bold; font-size: 1.2em; color: #333; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>BMI 計算器</h2>
        <input type="number" id="height" placeholder="身高 (公分)" step="0.1">
        <input type="number" id="weight" placeholder="體重 (公斤)" step="0.1">
        <button onclick="calculateBMI()">計算 BMI</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateBMI() {
            const height = document.getElementById('height').value;
            const weight = document.getElementById('weight').value;
            
            if(!height || !weight) {
                document.getElementById('result').innerText = "請輸入完整身高與體重！";
                return;
            }

            // 發送資料給後端 Python
            fetch('/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ height: parseFloat(height), weight: parseFloat(weight) })
            })
            .then(res => res.json())
            .then(data => {
                // 將後端傳回的 BMI 與狀態顯示在畫面上
                document.getElementById('result').innerHTML = `BMI 指數: ${data.bmi}<br>評語: ${data.status}`;
            })
            .catch(() => {
                document.getElementById('result').innerText = "連線失敗，請稍後再試";
            });
        }
    </script>
</body>
</html>
